name: Release

# Push a tag like v0.1.1 to publish. Publishing uses PyPI "trusted publishing" (no API token is stored
# in the repository): configure the project on pypi.org first, see python/RELEASING.md.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch IB Gateway jars (needed only to compile)
        run: |
          curl -fsSL https://download2.interactivebrokers.com/installers/ibgateway/stable-standalone/ibgateway-stable-standalone-linux-x64.sh -o gw.sh
          chmod +x gw.sh
          ./gw.sh -q -dir "$RUNNER_TEMP/gw"
          echo "IBC_BIN=$RUNNER_TEMP/gw/jars" >> "$GITHUB_ENV"
      - run: ant test jar
      - name: Build the wheel and sdist
        working-directory: python
        run: |
          python build_assets.py --jar ../resources/IBC.jar
          python -m pip install build twine
          python -m pip install -e ".[test]"
          python -m pytest -q
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
