[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ibc2"
dynamic = ["version"]
description = "One-command, always-on Interactive Brokers TWS / IB Gateway: auto-login, auto-restart, watchdog and alerts (a maintained fork of IBC)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
keywords = ["interactive brokers", "ibkr", "tws", "ib gateway", "ibc", "algo trading", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Java",
]
dependencies = [
    "keyring>=24",
    "tomli>=2; python_version < '3.11'",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ibc2 = "ibc2.cli:main"

[project.urls]
Homepage = "https://github.com/zalkabsi/IBC2.0"
Issues = "https://github.com/zalkabsi/IBC2.0/issues"
Upstream = "https://github.com/IbcAlpha/IBC"

[tool.hatch.version]
path = "src/ibc2/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ibc2"]
# _ibc/ holds IBC.jar and the launch scripts; it is assembled by build_assets.py
# and is git-ignored, so it must be listed explicitly.
artifacts = ["src/ibc2/_ibc/**"]

[tool.hatch.build.targets.sdist]
include = ["src/ibc2", "tests", "README.md", "build_assets.py"]
artifacts = ["src/ibc2/_ibc/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
